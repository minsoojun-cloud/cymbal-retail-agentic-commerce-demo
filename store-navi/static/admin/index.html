<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#1a73e8"/>
  <title>Cymbal Retail — 棚番管理</title>
  <link rel="icon" href="/static/shared/img/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/shared/css/tokens.css"/>
  <link rel="stylesheet" href="/static/admin/css/admin.css"/>
</head>
<body>
<header class="ah">
  <a class="ah__brand" href="/admin/" aria-label="棚番管理">
    <img src="/static/shared/img/logo.svg" alt="Cymbal Retail" class="ah__logo"/>
    <span class="ah__title">棚番管理</span>
  </a>
  <select id="store-select" class="ah__store" aria-label="店舗"></select>
  <span class="badge" id="status-badge">読み込み中…</span>
  <div class="ah__spacer"></div>
  <div class="ah__actions">
    <button type="button" class="btn btn--text" id="btn-undo" title="元に戻す (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.95 7.95 0 0 1 12.5 10c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 10.53 17.15 8 12.5 8z"/></svg>元に戻す
    </button>
    <button type="button" class="btn btn--tonal" id="btn-save">下書き保存</button>
    <button type="button" class="btn btn--text" id="btn-discard">下書き破棄</button>
    <button type="button" class="btn btn--text" id="btn-history">変更履歴</button>
    <button type="button" class="btn btn--primary" id="btn-publish">確認して公開</button>
    <a class="btn btn--text" id="staff-link" href="/">棚登録アプリ ↗</a>
  </div>
</header>

<main class="aw">
  <!-- ① floor plan -->
  <section class="card plan" aria-label="店舗平面図">
    <div class="plan__tools">
      <div class="seg" role="toolbar" aria-label="ツール">
        <button type="button" class="seg__btn active" data-tool="select" title="棚をクリックして選択（Shift で複数選択）。空いた所をドラッグで移動。">
          <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18.5z"/></svg>選択</button>
        <button type="button" class="seg__btn tool--edit" data-tool="draw" title="平面図の上をドラッグして新しい棚を描きます">
          <svg viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10zM7 9h4v2H7z"/><path d="M13 13h4v2h-4z"/></svg>棚を描く</button>
        <button type="button" class="seg__btn tool--edit" data-tool="move" title="選択した棚をドラッグで移動（0.3m 単位）">
          <svg viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></svg>移動</button>
      </div>
      <div class="plan__legend" aria-hidden="true">
        <span><i class="lg lg--sel"></i>選択中</span>
        <span><i class="lg lg--none"></i>番号未設定</span>
        <span><i class="lg lg--err"></i>番号エラー</span>
        <span><i class="lg lg--chg"></i>変更あり</span>
      </div>
      <div class="seg seg--zoom">
        <button type="button" class="seg__btn" id="zoom-fit" title="全体表示">全体</button>
        <button type="button" class="seg__btn" id="zoom-out" aria-label="縮小">−</button>
        <button type="button" class="seg__btn" id="zoom-in" aria-label="拡大">＋</button>
      </div>
    </div>
    <div class="plan__hint" id="plan-hint">棚をクリックすると右側で棚番号を設定できます。「棚を描く」で新しい棚を追加できます。</div>
    <div class="plan__canvas" id="plan-canvas">
      <svg id="plan-svg" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="店舗平面図（棚を選択）"></svg>
    </div>
  </section>

  <!-- ② side panel -->
  <aside class="card side" aria-label="棚番設定">
    <div class="tabs" role="tablist">
      <button type="button" class="tabs__btn active" data-ptab="shelf" role="tab" id="ptab-shelf">棚番号</button>
      <button type="button" class="tabs__btn" data-ptab="zone" role="tab" id="ptab-zone">区域</button>
    </div>
    <div class="side__body" id="side-body"></div>
  </aside>

  <!-- ③ errors -->
  <section class="card errs" id="errs" aria-label="エラー・棚番未指定">
    <div class="errs__hd">
      <h2><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>確認が必要な項目</h2>
      <span class="muted small" id="errs-sub"></span>
    </div>
    <div class="errs__grid">
      <div>
        <h3>公開前に修正（棚番号）<span class="cnt" id="val-count">0</span></h3>
        <ul class="errs__list" id="val-list"></ul>
      </div>
      <div>
        <h3>棚番未指定の商品 <span class="cnt cnt--red" id="un-count">0</span></h3>
        <p class="muted small">棚・棚番号の削除で陳列位置がなくなった商品です。「棚を指定」で棚登録アプリから新しい棚番を登録します（撮影不要）。</p>
        <ul class="errs__list" id="un-list"></ul>
      </div>
    </div>
  </section>
</main>

<!-- publish modal -->
<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="publish-modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" hidden>
  <div class="modal__hd"><h2 id="pm-title">変更内容を確認して公開</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button></div>
  <div class="modal__body" id="pm-body"></div>
  <div class="modal__ft">
    <button type="button" class="btn btn--text" data-close>キャンセル</button>
    <button type="button" class="btn btn--primary" id="pm-submit">公開する</button>
  </div>
</div>
<div class="modal" id="history-modal" role="dialog" aria-modal="true" aria-labelledby="hm-title" hidden>
  <div class="modal__hd"><h2 id="hm-title">変更履歴</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button></div>
  <div class="modal__body" id="hm-body"></div>
  <div class="modal__ft"><button type="button" class="btn btn--text" data-close>閉じる</button></div>
</div>

<!-- manager gate -->
<div class="gate" id="gate" hidden>
  <div class="gate__card">
    <img src="/static/shared/img/logo.svg" alt="Cymbal Retail" class="ah__logo"/>
    <h2>棚番管理は店長専用の画面です</h2>
    <p class="muted">デモ環境では下のボタンで店長としてログインできます。</p>
    <button type="button" class="btn btn--primary" id="gate-login">店長としてログイン（デモ）</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/admin/js/floorplan.js"></script>
<script src="/static/admin/js/admin.js"></script>
</body>
</html>
